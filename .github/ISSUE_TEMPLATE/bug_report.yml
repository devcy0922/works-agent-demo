name: Demo bug
description: Report a reproducible problem in the public reference implementation.
title: "bug: "
labels: [bug, triage]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command, scenario, and observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
